<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSource | Contato</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" type="image/svg" href="./imgs/openclipart-vectors-linux-2025130.svg"
</head>
<body>
  <header>
    <div class="logo">Open<span>Source</span></div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="sobre.html">Sobre</a></li>
        <li><a href="contato.html" class="active">Contato</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero" style="padding: 4rem 2rem;">
      <h1>Fale sobre seu projeto open source</h1>
    </section>

    <section class="contato-section">
      <div class="contato-container">
        <form action="#">
          <label for="nome">Nome / Username</label>
          <input type="text" id="nome" name="nome" placeholder="Seu alias" required>

          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="usuario@dominio.com" required>

          <label for="mensagem">Detalhes do projeto</label>
          <textarea id="mensagem" name="mensagem" rows="6" placeholder="Descreva seu projeto..." required></textarea>

          <button type="submit">Enviar Mensagem</button>
        </form>

        <aside class="info-contato">
          <h3 style="color: var(--text-main); margin-bottom: 1.5rem;">Canais da Comunidade</h3>
          <p><strong>Repositório Git:</strong><br> git.git.git.git</p>
          <p><strong>Fórum / IRC:</strong><br> opensource</p>
          <p><strong>Licença do Projeto:</strong><br> MIT</p>
        </aside>
      </div>
    </section>
  </main>

  <footer>
    <p>Atividade Acadêmica de Desenvolvimento Web.</p>
  </footer>
</body>
</html>
