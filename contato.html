<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenSource | Contato</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="icon" type="image/svg+xml" href="./imgs/openclipart-vectors-linux-2025130.svg">
</head>
<body class="d-flex flex-column min-vh-100">
  <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom border-secondary">
    <div class="container">
      <a class="navbar-brand text-info fw-bold" href="index.html">Open<span class="text-light">Source</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="sobre.html">Sobre</a></li>
          <li class="nav-item"><a class="nav-link active" href="contato.html">Contato</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5 flex-grow-1">
    <div class="text-center mb-5">
      <h1 class="display-6 fw-bold text-light">Fale sobre seu projeto open source</h1>
    </div>

    <div class="row g-5 justify-content-center">
      <div class="col-md-7">
        <form action="#" class="bg-body-tertiary p-4 rounded border border-secondary shadow-sm">
          <div class="mb-3">
            <label for="nome" class="form-label text-info fw-bold">Nome / Username</label>
            <input type="text" class="form-control bg-dark border-secondary text-light" id="nome" name="nome" placeholder="Seu alias" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label text-info fw-bold">E-mail</label>
            <input type="email" class="form-control bg-dark border-secondary text-light" id="email" name="email" placeholder="usuario@dominio.com" required>
          </div>
          <div class="mb-4">
            <label for="mensagem" class="form-label text-info fw-bold">Detalhes do projeto</label>
            <textarea class="form-control bg-dark border-secondary text-light" id="mensagem" name="mensagem" rows="5" placeholder="Descreva seu projeto..." required></textarea>
          </div>
          <button type="submit" class="btn btn-info w-100 fw-bold">Enviar Mensagem</button>
        </form>
      </div>
      
      <div class="col-md-4">
        <div class="p-4 rounded border border-secondary bg-body-tertiary h-100 shadow-sm">
          <h3 class="h5 text-info mb-4 border-bottom border-secondary pb-2">Canais da Comunidade</h3>
          <ul class="list-unstyled text-secondary">
            <li class="mb-3">
              <strong class="text-light">Repositório Git:</strong><br> git.git.git.git
            </li>
            <li class="mb-3">
              <strong class="text-light">Fórum / IRC:</strong><br> opensource
            </li>
            <li>
              <strong class="text-light">Licença do Projeto:</strong><br> MIT
            </li>
          </ul>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-body-tertiary text-center py-4 border-top border-secondary text-secondary">
    <div class="container">
      <p class="mb-0">Atividade Acadêmica de Desenvolvimento Web.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
